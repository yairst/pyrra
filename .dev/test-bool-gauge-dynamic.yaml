# Test SLO - BoolGauge with Dynamic Burn Rate
# Used for testing BoolGauge indicator type with dynamic burn rate
apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: test-bool-gauge-dynamic
  namespace: monitoring
  labels:
    pyrra.dev/team: platform
spec:
  target: "99.0"
  window: 30d
  description: "Test BoolGauge indicator with dynamic burn rate"
  indicator:
    bool_gauge:
      metric: up{job="prometheus-k8s"}
  alerting:
    name: TestBoolGaugeDynamicErrorBudgetBurn
    burnRateType: dynamic
    burnrates: true
    absent: true
